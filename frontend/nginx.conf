server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: TanStack Router сам разрулит маршрут на клиенте.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Прокси к бэкенду внутри Docker-сети.
    # Префикс /api сохраняется (бэкенд ожидает /api/* — см. api-spec.json).
    #   GET  /api/jwt/me  →  GET  http://backend:8000/api/jwt/me
    #   POST /api/jwt/login → POST http://backend:8000/api/jwt/login
    location /api/ {
        proxy_pass http://${BACKEND_HOST}:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
