name: campusmadi-backend

# ЗАПУСКАЕТСЯ НА СЕРВЕРЕ 10.10.213.15
# Содержит Redis + FastAPI-приложение. PostgreSQL живёт на 10.10.213.48.
# Контекст сборки указывает на корень репозитория (../..), чтобы Dockerfile
# из Backend/ мог скопировать исходники.

services:
  redis:
    image: redis:8.0-alpine
    container_name: campusmadi-redis
    restart: unless-stopped
    # Порт наружу не пробрасываем: Redis нужен только бэкенду в этой же сети.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ../../Backend
      dockerfile: Dockerfile
    image: campusmadi-backend:latest
    container_name: campusmadi-app
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DB_TYPE: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    ports:
      - "8000:8000"
    volumes:
      # Сохраняем загруженные файлы между перезапусками контейнера.
      - uploads_data:/app/uploads
    # CMD из Dockerfile (uvicorn) НЕ переопределяем.
    # Инициализация БД и тестовые юзеры — одноразово вручную:
    #   docker compose run --rm app /app/.venv/bin/python init_db.py
    #   docker compose run --rm app /app/.venv/bin/python create_test_users.py

volumes:
  uploads_data:
